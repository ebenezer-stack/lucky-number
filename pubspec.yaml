name: b_glory_tirage
description: "Application B-GLORY de tirage de numéros"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Base de données
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  
  # État et gestion
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  
  # UI et animations
  google_fonts: ^6.3.0
  fl_chart: ^0.70.2
  confetti: ^0.8.0
  
  # Sons et vibration
  audioplayers: ^6.4.0
  vibration: ^3.1.8
  
  # Partage et utilitaires
  share_plus: ^11.0.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  
  # Internationalisation
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0F0F13"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0F0F13"
  image: "assets/images/splash.png"
  android_12:
    image: "assets/images/splash.png"
    color: "#0F0F13"

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/logo.png
    - assets/images/splash.png
